events {}

http {
  upstream bonsai {
    least_conn;                                   # each request goes to the GPU with fewer active requests
    server bonsai-nvidia:8080 max_fails=3 fail_timeout=30s;
    server bonsai-amd:8080    max_fails=3 fail_timeout=30s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://bonsai;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;                        # required for token streaming
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      client_max_body_size 50m;
      add_header X-Upstream $upstream_addr always;  # shows which GPU served the request
    }
  }
}
