events {}

http {
  include /etc/nginx/mime.types;                  # so the bench page is served as HTML

  resolver 127.0.0.11 valid=10s ipv6=off;        # Docker's DNS; re-resolve when a GPU container restarts

  upstream bonsai {
    zone bonsai 64k;
    least_conn;                                   # each request goes to the GPU with fewer active requests
    server bonsai-nvidia:8080 max_fails=3 fail_timeout=30s resolve;
    server bonsai-amd:8080    max_fails=3 fail_timeout=30s resolve;
  }

  server {
    listen 80;

    location = /bench { return 301 /bench/; }
    location /bench/ {
      alias /usr/share/nginx/bench/;              # benchmark page, same origin as the API
      index index.html;
    }

    location / {
      proxy_pass http://bonsai;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;                        # required for token streaming
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      client_max_body_size 50m;
      add_header X-Upstream $upstream_addr always;  # shows which GPU served the request
    }
  }
}
