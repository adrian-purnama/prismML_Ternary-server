services:
  bonsai:
    build:
      context: .
      args:
        BASE_IMAGE: nvidia/cuda:12.8.1-runtime-ubuntu24.04
        LLAMA_BACKEND: cuda
        CUDA_VERSION: "12.8"
    image: bonsai2-server:cuda
    restart: unless-stopped
    ports:
      - "11437:8080"
    environment:
      BONSAI_PACKING: "PTQ1_0"     # PTQ1_0 is faster on Ada-gen cards / L4; PQ2_0 elsewhere
      BONSAI_NGL: "99"            # offload every layer to GPU
      BONSAI_CTX: "16384"
      BONSAI_HOST: "0.0.0.0"
      PORT: "8080"
      BONSAI_VISION: "0"
      BONSAI_EXTRA_ARGS: "--cache-type-k q4_0 --cache-type-v q4_0 --reasoning-budget 2048"
    volumes:
      - /hdd1/model-files/bonsai2:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
